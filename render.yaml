services:
  - type: web
    name: university-clearance-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn e_clearance.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: university-clearance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: REDIS_URL
        fromService:
          type: redis
          name: university-clearance-redis
          property: connectionString

  - type: redis
    name: university-clearance-redis
    ipAllowList: []
    plan: free

databases:
  - name: university-clearance-db
    databaseName: clearance
    user: clearance_user
    plan: free
