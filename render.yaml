services:
  - type: web
    name: university-clearance-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn e_clearance.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: university-clearance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,university-e-clearance.onrender.com"
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0  